name: GitHub Action Using Self-Hosted Runner (EC2)

on: [push]

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-versions: [16, 17]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-versions }}

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build
